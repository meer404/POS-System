<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>سیستەمی فرۆشتن</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/pages/pos.css" />
<link rel="stylesheet" href="css/pages/returns.css" />
<link rel="stylesheet" href="css/pages/products.css" />
<link rel="stylesheet" href="css/pages/reports.css" />
<link rel="stylesheet" href="css/pages/expiry.css" />
<link rel="stylesheet" href="css/pages/home.css" />
</head>
<body>

<div id="toast-container"></div>

<!-- Login screen -->
<div id="login-screen" class="hidden">
    <div class="login-card">
        <div class="brand-icon"><img class="icon" src="assets/icons/shop.svg" alt="" /></div>
        <h1>سیستەمی فرۆشتن</h1>
        <p class="subtitle">تکایە بچۆرە ژوورەوە بۆ بەردەوامبوون</p>
        <form id="login-form" class="flex flex-col gap-14">
            <div class="form-group">
                <label for="login-username">ناوی بەکارهێنەر</label>
                <input type="text" id="login-username" class="input-lg" autocomplete="username" required />
            </div>
            <div class="form-group">
                <label for="login-password">وشەی نهێنی</label>
                <input type="password" id="login-password" class="input-lg" autocomplete="current-password" required />
            </div>
            <div id="login-error" class="field-error hidden"></div>
            <button type="submit" class="btn btn-primary btn-block input-lg" id="login-submit-btn">
                چوونەژوورەوە
            </button>
        </form>
    </div>
</div>

<!-- Main app shell -->
<div id="app-shell" class="hidden">
    <aside id="sidebar">
        <div class="brand">
            <div class="brand-icon"><img class="icon" src="assets/icons/shop.svg" alt="" /></div>
            <div class="brand-title">فرۆشگا</div>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <img class="icon" src="assets/icons/person-circle.svg" alt="" />
                <div class="sidebar-user-info">
                    <span class="sidebar-user-name" id="sidebar-username">-</span>
                    <span class="sidebar-user-role" id="sidebar-userrole">-</span>
                </div>
            </div>
            <button class="sidebar-logout-btn" id="logout-btn">
                <img class="icon" src="assets/icons/box-arrow-right.svg" alt="" />
                <span>دەرچوون</span>
            </button>
        </div>
    </aside>

    <div id="main-area">
        <header id="topbar">
            <h1 class="page-title" id="page-title"></h1>
        </header>
        <main id="app"></main>
    </div>
</div>

<script src="js/vendor/chart.min.js"></script>
<script src="js/api.js"></script>
<script src="js/format.js"></script>
<script src="js/numeric-input.js"></script>
<script src="js/state.js"></script>
<script src="js/scanner-focus.js"></script>
<script src="js/toast.js"></script>
<script src="js/router.js"></script>
<script src="js/pages/pos.js"></script>
<script src="js/pages/returns.js"></script>
<script src="js/pages/product-add.js"></script>
<script src="js/pages/product-list.js"></script>
<script src="js/pages/reports.js"></script>
<script src="js/pages/expiry.js"></script>
<script src="js/pages/users.js"></script>
<script src="js/pages/home.js"></script>
<script src="js/app.js"></script>
</body>
</html>
