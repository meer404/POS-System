<div class="expiry-section">
    <div class="expiry-section-title expired">
        <img class="icon" src="assets/icons/exclamation-triangle.svg" alt="" />
        بەسەرچووەکان
    </div>
    <div class="card">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>کاڵا</th>
                        <th>بڕ</th>
                        <th>بەرواری بەسەرچوون</th>
                        <th>وەرگیراوە لە</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="expired-body"></tbody>
            </table>
        </div>
        <div id="expired-empty" class="empty-state hidden">
            <img class="icon" src="assets/icons/check-circle.svg" alt="" />
            <p>هیچ کاڵایەکی بەسەرچوو نییە</p>
        </div>
    </div>
</div>
