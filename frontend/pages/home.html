<div class="home-header">
    <div class="home-header-brand">
        <div class="brand-icon"><img class="icon" src="assets/icons/shop.svg" alt="" /></div>
        <div>
            <div class="home-store-name">سیستەمی فرۆشتن</div>
            <div class="home-welcome">بەخێربێیتەوە</div>
        </div>
    </div>
    <div class="home-header-user">
        <div class="home-user-info">
            <span class="home-username" id="home-username">-</span>
            <span class="home-userrole" id="home-userrole">-</span>
        </div>
        <button class="btn btn-outline" id="home-logout-btn">
            <img class="icon" src="assets/icons/box-arrow-right.svg" alt="" />
            <span>دەرچوون</span>
        </button>
    </div>
</div>

<div class="stats-grid hidden" id="home-quick-stats">
    <div class="stat-card">
        <div class="stat-icon primary"><img class="icon" src="assets/icons/cart3.svg" alt="" /></div>
        <div>
            <div class="stat-value" id="home-stat-revenue">٠</div>
            <div class="stat-label">کۆی فرۆشتنی ئەمڕۆ</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon warn"><img class="icon" src="assets/icons/clock-history.svg" alt="" /></div>
        <div>
            <div class="stat-value" id="home-stat-near-expiry">٠</div>
            <div class="stat-label">کاڵای نزیک بەسەرچوون</div>
        </div>
    </div>
</div>

<div class="home-nav-grid" id="home-nav-grid"></div>
