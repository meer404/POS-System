<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- فرۆشتن POS System — Logo Mark -->
  <rect width="80" height="80" rx="18" fill="#0B5E5E"/>
  <!-- Screen frame -->
  <rect x="12" y="10" width="56" height="36" rx="5" fill="white" fill-opacity="0.08"/>
  <rect x="12" y="10" width="56" height="36" rx="5" stroke="white" stroke-opacity="0.13" stroke-width="1"/>
  <!-- Item rows (name columns) -->
  <rect x="19" y="19" width="28" height="2" rx="1" fill="white" fill-opacity="0.62"/>
  <rect x="19" y="25" width="21" height="2" rx="1" fill="white" fill-opacity="0.62"/>
  <rect x="19" y="31" width="25" height="2" rx="1" fill="white" fill-opacity="0.62"/>
  <!-- Price columns (gold) -->
  <rect x="52" y="19" width="10" height="2" rx="1" fill="#D4A017"/>
  <rect x="54" y="25" width="7"  height="2" rx="1" fill="#D4A017"/>
  <rect x="52" y="31" width="10" height="2" rx="1" fill="#D4A017"/>
  <!-- Separator -->
  <rect x="12" y="46" width="56" height="0.75" fill="white" fill-opacity="0.08"/>
  <!-- Terminal base -->
  <rect x="22" y="47" width="36" height="7" rx="3.5" fill="white" fill-opacity="0.1"/>
  <!-- Receipt paper -->
  <rect x="28" y="54" width="24" height="20" rx="2.5" fill="white"/>
  <!-- Receipt content lines -->
  <rect x="32" y="59" width="13" height="1.5" rx="0.75" fill="#0B5E5E" fill-opacity="0.2"/>
  <rect x="32" y="63" width="9"  height="1.5" rx="0.75" fill="#0B5E5E" fill-opacity="0.2"/>
  <!-- Gold total bar -->
  <rect x="32" y="67" width="14" height="2.5" rx="1.25" fill="#D4A017"/>
</svg>
